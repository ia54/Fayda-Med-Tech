name: Managed UI lock refresh

on:
  pull_request:
    paths:
      - 'deploy/production/godaddy-node/package-lock.json'
      - '.github/workflows/managed-ui-lock-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh managed UI audit lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/production/godaddy-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
      - name: Update only packages with available non-breaking audit fixes
        run: npm exec --yes --package=npm@11.9.0 -- npm install --package-lock-only --no-fund
      - run: npm exec --yes --package=npm@11.9.0 -- npm audit --package-lock-only --audit-level=moderate
      - name: Preserve generated lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-managed-ui-lock
          path: deploy/production/godaddy-node/package-lock.json
          if-no-files-found: error
          retention-days: 1
