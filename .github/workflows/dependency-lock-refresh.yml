name: Dependency lock refresh

on:
  pull_request:
    paths:
      - 'api/composer.json'
      - 'api/composer.lock'
      - '.github/workflows/dependency-lock-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Symfony security lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, zip, bcmath, intl, sodium
          coverage: none
          tools: composer:v2
      - name: Update only the audited Symfony packages and compatible dependencies
        run: >-
          composer update symfony/http-foundation symfony/http-kernel symfony/mime
          symfony/routing symfony/yaml --with-all-dependencies --no-scripts --no-plugins
          --no-interaction --prefer-dist
      - run: composer validate --no-check-publish --no-interaction
      - run: composer audit --locked --abandoned=report --no-interaction
      - name: Preserve the generated lockfile for review
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: refreshed-composer-lock
          path: api/composer.lock
          if-no-files-found: error
          retention-days: 1
